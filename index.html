<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenPlay</title>
<style>
:root{--bg:#0d0e11;--sf:#181a20;--ink:#f1f2f6;--mute:#8b90a0;--acc:#2ecc71;--line:#262932;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.tab{display:none;flex:1;overflow-y:auto;padding:12px 14px 16px}.tab.on{display:block}
nav{display:flex;background:var(--sf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:8px 0;font:inherit;font-size:11px}
nav button.on{color:var(--acc)}nav b{display:block;font-size:20px;font-weight:400}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
h2{margin:0;font-size:24px}
.add{background:var(--acc);color:#04210f;border:0;border-radius:20px;padding:8px 16px;font:inherit;font-weight:700}
.row{display:flex;gap:12px;align-items:center;padding:8px 0}
.th{width:96px;height:54px;border-radius:8px;background:#23252d center/cover;flex:none;position:relative;display:grid;place-items:center;color:#667}
.th i{position:absolute;right:3px;bottom:3px;font:11px/1 sans-serif;background:#000b;padding:2px 4px;border-radius:4px;color:#fff}
.nm{flex:1;min-width:0}.nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:70px 24px}
.vip{background:linear-gradient(135deg,#f7b955,#ef9a2a);color:#3a2300;border-radius:16px 16px 0 0;padding:16px;display:flex;justify-content:space-around;text-align:center}
.vip b{font-size:28px;display:block}
.vipbar{background:#2a2b30;color:#e9c892;border-radius:0 0 16px 16px;padding:12px 16px;font-weight:700;margin-bottom:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;text-align:center;margin-bottom:12px}
.grid3 button{background:none;border:0;color:var(--ink);font:inherit;font-size:13px}.grid3 b{display:block;font-size:26px;font-weight:400;margin-bottom:4px}
.li{display:flex;justify-content:space-between;gap:10px;padding:16px 4px;border-bottom:1px solid var(--line)}.li span:last-child{color:var(--mute);text-align:right}
.sl{display:grid;grid-template-columns:105px 1fr 56px;gap:8px;align-items:center;padding:9px 0}.sl input{accent-color:var(--acc);width:100%}.sl b{font-weight:400;color:var(--mute);font-size:13px;text-align:right}
.g9{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.g9 button{height:84px;border:0;border-radius:14px;background:var(--sf)}.g9 button.m{background:var(--acc)}
#mini{display:none;align-items:center;gap:10px;background:#20232b;padding:8px 14px}#mini.on{display:flex}#mini span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini button{background:none;border:0;color:var(--acc);font-size:22px}
#player{position:fixed;inset:0;background:#000;display:none;z-index:20}#player.on{display:block}
video{width:100%;height:100%;object-fit:contain}
#art{display:none;position:absolute;inset:0;place-items:center;font-size:96px;color:#333;pointer-events:none}
#tap{position:absolute;inset:0;touch-action:none}
#ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#000b,#0000 22%,#0000 62%,#000c);pointer-events:none;transition:opacity .2s;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
#ctl.hide{opacity:0}#ctl>*{pointer-events:auto}#ctl.hide>*{pointer-events:none}
.pt{display:flex;align-items:center;gap:8px;padding-top:8px}.pt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{display:flex;justify-content:center;gap:28px;align-items:center}.pc button{font-size:30px;width:64px;height:64px;border-radius:50%;background:#0006}
#ctl button{background:none;border:0;color:#fff;font:inherit;min-width:40px;min-height:40px}
.sk{display:flex;align-items:center;gap:8px;font-size:12px}.sk input{flex:1;accent-color:var(--acc)}
.pr{display:flex;justify-content:space-around;padding-bottom:8px}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#sheet.on{display:flex}
#sheet .h{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:20px}#sheet .h button{background:none;border:0;color:var(--ink);font-size:24px}
#shb{flex:1;overflow:auto;padding:0 14px 20px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}#toast.show{opacity:1}
button:focus-visible{outline:2px solid var(--acc)}
</style></head><body>
<div id="app">
 <section class="tab on" id="t-video"><div class="top"><h2>Video</h2><button class="add" id="addv">Add videos</button></div><div id="lv"></div></section>
 <section class="tab" id="t-me">
  <div class="vip"><div><b id="nv">0</b>Videos</div><div><b>HD</b>Playback</div><div><b>∞</b>Ad-free</div></div>
  <div class="vipbar">👑 Premium unlocked</div>
  <div class="grid3"><button id="mh"><b>🕘</b>History</button><button id="mt"><b>🎨</b>Theme</button><button id="mc"><b>🧹</b>Clean</button><button id="ms"><b>⏰</b><span id="msl">Sleep timer</span></button><button id="msub"><b>💬</b>Subtitles</button><button id="mf"><b>📂</b>Add files</button></div>
  <div class="li" id="mset"><span>Settings</span><span>›</span></div>
  <div class="li"><span>About</span><span>OpenPlay 1.0 · personal use</span></div>
 </section>
 <nav><button class="on" data-t="video"><b>🎬</b>VIDEO</button><button data-t="me"><b>👤</b>ME</button></nav>
</div>

<div id="player">
 <video id="v" playsinline></video><div id="art">♫</div><div id="tap"></div>
 <div id="ctl">
  <div class="pt"><button id="pb" aria-label="Back">←</button><span id="pn"></span><button id="psub">CC</button></div>
  <div class="pc"><button id="pprev" aria-label="Previous">⏮</button><button id="pplay" aria-label="Play or pause">⏸</button><button id="pnext" aria-label="Next">⏭</button></div>
  <div><div class="sk"><span id="pcur">0:00</span><input id="pseek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="pdur">0:00</span></div>
  <div class="pr"><button id="pspd">1×</button><button id="ploop">Loop</button><button id="pfit">Fit</button><button id="pmir">Mirror</button><button id="ppip">PiP</button><button id="pfs">⛶</button></div></div>
 </div>
</div>
<div id="sheet"><div class="h"><button id="shbk" aria-label="Back">←</button><span id="sht"></span></div><div id="shb"></div></div>
<div id="toast"></div>
<input id="pick" type="file" multiple hidden><input id="subpick" type="file" accept=".srt,.vtt" hidden>

<script>
const $=i=>document.getElementById(i),v=$('v');
const rd=k=>{try{return localStorage.getItem(k)}catch(e){return null}},wr=(k,x)=>{try{x===null?localStorage.removeItem(k):localStorage.setItem(k,x)}catch(e){}};
const fmt=s=>{if(!isFinite(s))return'0:00';s=~~s;const h=~~(s/3600),m=~~(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const key=f=>'op:'+f.name+':'+f.size;
let L={v:[],a:[]},cl='v',ci=-1,url,ctx,bN,tN,gN,boost=1,br=1,ct=1,sa=1,fit=0,mir=0,spd=1,tapT=0,tapTm,hideT,g=null,blk=0,sleepT,sleepI=0,lastSave=0;
const skipS=()=>+(rd('cfg:skip')||10);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1200)}
const accs=['#2ecc71','#3da5ff','#ff9f43','#ff5d8f'];let ai=+(rd('cfg:acc')||0);document.documentElement.style.setProperty('--acc',accs[ai]||accs[0]);

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,nav button').forEach(x=>x.classList.remove('on'));$('t-'+b.dataset.t).classList.add('on');b.classList.add('on')});

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.style.backgroundImage='url('+e.target.dataset.img+')';io.unobserve(e.target)}}),{root:$('t-video'),rootMargin:'300px'});
let PX={};
function row(it,k,i){const r=document.createElement('div');r.className='row';const th=document.createElement('div');th.className='th';
 if(it.img){if(it.uri){th.dataset.img=it.img;io.observe(th)}else th.style.backgroundImage='url('+it.img+')'}else th.textContent=k==='a'?'♫':'▶';
 if(it.dur){const d=document.createElement('i');d.textContent=fmt(it.dur);th.appendChild(d)}
 const n=document.createElement('div');n.className='nm';const a=document.createElement('div');a.textContent=it.name.replace(/\.[^.]+$/,'');
 const s=document.createElement('small');s.textContent=(it.size/1048576).toFixed(1)+' MB'+(PX[it.uri]?' · Resume '+fmt(PX[it.uri]/1000):'');n.append(a,s);r.append(th,n);r.onclick=()=>play(k,i);return r}
function render(){io.disconnect();['v'].forEach(k=>{const c=$('l'+k);c.innerHTML='';
 if(!L[k].length){c.innerHTML='<div class="empty">'+(k==='v'?'No videos yet. Tap Add videos and pick files from your phone.':'No songs yet. Tap Add songs and pick audio files.')+'</div>';return}
 L[k].forEach((it,i)=>c.appendChild(row(it,k,i)))});$('nv').textContent=L.v.length}
function meta(it){return new Promise(r=>{const e=document.createElement(it.k==='a'?'audio':'video'),u=URL.createObjectURL(it.f);let done=0;
 const fin=x=>{if(done)return;done=1;URL.revokeObjectURL(u);r(x||{})};e.muted=true;e.preload='metadata';e.src=u;e.onerror=()=>fin();setTimeout(()=>fin(),4000);
 e.onloadedmetadata=()=>{if(it.k==='a')fin({dur:e.duration});else e.currentTime=Math.min(1,e.duration/4||0)};
 e.onseeked=()=>{const c=document.createElement('canvas');c.width=160;c.height=90;try{c.getContext('2d').drawImage(e,0,0,160,90);fin({img:c.toDataURL('image/jpeg',.6),dur:e.duration})}catch(x){fin({dur:e.duration})}}})}
async function addFiles(fs){const n=[];for(const f of fs){const a=f.type.startsWith('audio')||/\.(mp3|m4a|flac|wav|ogg|opus|aac)$/i.test(f.name),vd=f.type.startsWith('video')||/\.(mp4|mkv|webm|avi|mov|3gp)$/i.test(f.name);
 if(!vd)continue;const it={f,k:'v',name:f.name,size:f.size};L[it.k].push(it);n.push(it)}
 if(!n.length){toast('No video files found');return}render();for(const it of n){Object.assign(it,await meta(it));render()}}
function choose(acc){$('pick').accept=acc;$('pick').click()}
$('addv').onclick=()=>choose('video/*');$('mf').onclick=()=>choose('video/*');
$('pick').onchange=e=>{const fs=[...e.target.files];e.target.value='';addFiles(fs)};

function setup(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();const s=ctx.createMediaElementSource(v);
 bN=ctx.createBiquadFilter();bN.type='lowshelf';bN.frequency.value=200;tN=ctx.createBiquadFilter();tN.type='highshelf';tN.frequency.value=3000;gN=ctx.createGain();gN.gain.value=boost;
 s.connect(bN);bN.connect(tN);tN.connect(gN);gN.connect(ctx.destination)}catch(e){ctx=null}}
const applyF=()=>{v.style.filter='brightness('+br+') contrast('+ct+') saturate('+sa+')'};
function paint(){v.style.transform=mir?'scaleX(-1)':'';v.style.objectFit=['contain','cover','fill'][fit]}

function play(k,i){const it=L[k][i];if(!it)return;if(window.Android&&it.uri){const d=L.v.filter(x=>x.uri);Android.playNative(JSON.stringify(d.map(x=>({u:x.uri,n:x.name}))),d.indexOf(it));return}cl=k;ci=i;if(url&&url.startsWith('blob:'))URL.revokeObjectURL(url);url=it.f?URL.createObjectURL(it.f):it.src;
 v.querySelectorAll('track').forEach(t=>t.remove());v.src=url;v.playbackRate=spd;const sv=parseFloat(rd(key(it)));
 v.onloadedmetadata=()=>{if(rd('cfg:resume')!=='0'&&sv>5&&sv<v.duration-5){v.currentTime=sv;toast('Resumed at '+fmt(sv))}};
 setup();const p=v.play();if(p)p.catch(()=>{});$('pn').textContent=it.name;$('art').style.display=k==='a'?'grid':'none';
 $('player').classList.add('on');showC();updMini();
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:it.name.replace(/\.[^.]+$/,''),artist:'OpenPlay'})}
function closeP(){$('player').classList.remove('on');if(cl==='v')v.pause();if(document.fullscreenElement)document.exitFullscreen();updMini()}
function updMini(){}
function showC(){$('ctl').classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>{if(!v.paused)$('ctl').classList.add('hide')},3500)}
function skip(d){v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d));toast((d>0?'+':'−')+Math.abs(d)+' s')}

v.onplay=()=>{$('pplay').textContent='⏸';if(ctx&&ctx.state==='suspended')ctx.resume()};
v.onpause=()=>{$('pplay').textContent='▶';showC()};
v.ontimeupdate=()=>{$('pcur').textContent=fmt(v.currentTime);$('pdur').textContent=fmt(v.duration);if(v.duration)$('pseek').value=v.currentTime/v.duration*1000;
 const n=Date.now(),it=L[cl][ci];if(it&&n-lastSave>2000){lastSave=n;wr(key(it),v.currentTime)}};
v.onended=()=>{const it=L[cl][ci];if(it)wr(key(it),null);if(!v.loop&&ci<L[cl].length-1)play(cl,ci+1)};
$('pseek').oninput=e=>{if(v.duration)v.currentTime=e.target.value/1000*v.duration;showC()};
$('pplay').onclick=()=>v.paused?v.play():v.pause();
$('pprev').onclick=()=>play(cl,ci-1);$('pnext').onclick=()=>play(cl,ci+1);$('pb').onclick=closeP;
$('pspd').onclick=()=>{const a=[1,1.25,1.5,2,.5,.75];spd=a[(a.indexOf(spd)+1)%a.length];v.playbackRate=spd;$('pspd').textContent=spd+'×'};
$('ploop').onclick=e=>{v.loop=!v.loop;e.target.style.color=v.loop?'var(--acc)':'#fff'};
$('pfit').onclick=()=>{fit=(fit+1)%3;paint();toast(['Fit','Crop to fill','Stretch'][fit])};
$('pmir').onclick=()=>{mir=!mir;paint()};
$('ppip').onclick=async()=>{try{document.pictureInPictureElement?await document.exitPictureInPicture():await v.requestPictureInPicture()}catch(e){toast('Pop-up is not supported here')}};
$('pfs').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await $('player').requestFullscreen();screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}}catch(e){toast('Fullscreen is not available')}};
$('psub').onclick=()=>$('subpick').click();$('msub').onclick=()=>$('subpick').click();
$('subpick').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let t=await f.text();
 if(!/^\s*WEBVTT/.test(t))t='WEBVTT\n\n'+t.replace(/\r/g,'').replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2');
 v.querySelectorAll('track').forEach(x=>x.remove());const tr=document.createElement('track');tr.kind='subtitles';tr.label=f.name;tr.default=true;
 tr.src=URL.createObjectURL(new Blob([t],{type:'text/vtt'}));v.appendChild(tr);setTimeout(()=>{if(tr.track)tr.track.mode='showing'},300);toast('Subtitles loaded')};

/* gestures: swipe left side = brightness, right side = volume, horizontal = seek, double-tap = skip */
const tap=$('tap'),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
tap.addEventListener('touchstart',e=>{const t=e.touches[0];g={x:t.clientX,y:t.clientY,m:null,t:v.currentTime,vol:boost,br:br,w:tap.clientWidth,h:tap.clientHeight}},{passive:true});
tap.addEventListener('touchmove',e=>{if(!g)return;const t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;
 if(!g.m&&(Math.abs(dx)>14||Math.abs(dy)>14))g.m=Math.abs(dx)>Math.abs(dy)?'s':(g.x<g.w/2?'b':'v');
 if(g.m==='s'&&v.duration){v.currentTime=clamp(g.t+dx/g.w*90,0,v.duration);toast(fmt(v.currentTime))}
 else if(g.m==='b'){br=clamp(g.br-dy/g.h*1.5,.3,2);applyF();toast('Brightness '+Math.round(br*100)+'%')}
 else if(g.m==='v'){boost=clamp(g.vol-dy/g.h*3,0,3);setup();if(gN)gN.gain.value=boost;toast('Volume '+Math.round(boost*100)+'%')}},{passive:true});
tap.addEventListener('touchend',()=>{if(g&&g.m)blk=1;g=null});
tap.onclick=e=>{if(blk){blk=0;return}const x=e.offsetX/tap.clientWidth,n=Date.now();
 if(n-tapT<300){clearTimeout(tapTm);tapT=0;if(x<.4)skip(-skipS());else if(x>.6)skip(skipS());else v.paused?v.play():v.pause()}
 else{tapT=n;tapTm=setTimeout(()=>{tapT=0;$('ctl').classList.contains('hide')?showC():$('ctl').classList.add('hide')},300)}};


/* me */
function sheet(t,fill){$('sht').textContent=t;$('shb').innerHTML='';fill($('shb'));$('sheet').classList.add('on')}
$('shbk').onclick=()=>$('sheet').classList.remove('on');
function li(b,a,c,fn){const d=document.createElement('div');d.className='li';const x=document.createElement('span'),y=document.createElement('span');x.textContent=a;y.textContent=c||'';d.append(x,y);if(fn)d.onclick=fn;b.appendChild(d)}
function settings(){sheet('Settings',b=>{
 li(b,'Resume playback',rd('cfg:resume')==='0'?'Off':'On',()=>{wr('cfg:resume',rd('cfg:resume')==='0'?'1':'0');settings()});
 li(b,'Double-tap skip',skipS()+' s',()=>{wr('cfg:skip',{10:15,15:30,30:10}[skipS()]);settings()});
 if(window.Android)li(b,'Rescan videos','Tap',()=>{loadDevice();$('sheet').classList.remove('on')});li(b,'Gestures','Left: brightness · Right: volume');li(b,'Subscription','Premium unlocked')})}
$('mset').onclick=settings;
$('mh').onclick=()=>sheet('History',b=>{let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('op:')){n++;li(b,k.slice(3,k.lastIndexOf(':')),fmt(parseFloat(localStorage.getItem(k))))}}}catch(e){}if(!n)b.innerHTML='<div class="empty">Nothing here yet. Videos you stop midway appear here.</div>'});
$('mt').onclick=()=>{ai=(ai+1)%accs.length;document.documentElement.style.setProperty('--acc',accs[ai]);wr('cfg:acc',ai)};
$('mc').onclick=()=>{try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('op:'))ks.push(k)}ks.forEach(k=>localStorage.removeItem(k));toast('History cleaned ('+ks.length+')')}catch(e){}};
$('ms').onclick=()=>{const o=[0,15,30,60,90];sleepI=(sleepI+1)%o.length;clearTimeout(sleepT);const m=o[sleepI];
 if(m){sleepT=setTimeout(()=>{v.pause();$('msl').textContent='Sleep timer';sleepI=0},m*60000);$('msl').textContent='Stops in '+m+' min';toast('Sleep timer: '+m+' minutes')}else{$('msl').textContent='Sleep timer';toast('Sleep timer off')}};


if('mediaSession' in navigator){const a=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f)}catch(e){}};
 a('play',()=>v.play());a('pause',()=>v.pause());a('previoustrack',()=>play(cl,ci-1));a('nexttrack',()=>play(cl,ci+1));a('seekbackward',()=>skip(-10));a('seekforward',()=>skip(10))}
function loadDevice(){if(!window.Android)return;try{PX=JSON.parse(Android.getAllPos())}catch(e){}let a=[];try{a=JSON.parse(Android.listVideos())}catch(e){}
 L.v=a.map(x=>({k:'v',name:x.name,size:x.size,dur:x.dur,src:'/media/'+x.id,uri:'content://media/external/video/media/'+x.id,img:'/thumb/'+x.id})).concat(L.v.filter(x=>x.f));render();toast(a.length+' videos found')}
window.refreshPos=()=>{if(!window.Android)return;try{PX=JSON.parse(Android.getAllPos())}catch(e){}render()};
window.onMediaPerm=()=>{Android.hasPerm()?loadDevice():toast('Media permission denied. Use Add videos.')};
render();
if(window.Android){Android.hasPerm()?loadDevice():Android.requestPerm()}
</script></body></html>
